name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # macos-15 is the Apple Silicon image, matching the architectures Third Hand ships for.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build release
        run: swift build -c release

      - name: Run tests
        run: swift test
